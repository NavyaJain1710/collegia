<!DOCTYPE html>
<html>
<head>
    <title>Faculty Dashboard</title>
    <link rel="stylesheet" href="faculty_dashboard.css">
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>XYZ</h2>
        <p>Faculty ID: 2309</p>
        <p>Department</p>
        <p>Assistant Professor</p>
        <ul>
            <li><a href="#">Dashboard</a></li>
            <li><a href="#">Courses</a></li>
            <li><a href="#">Notifications</a></li>
            <li><a href="#">Report</a></li>
            <li><a href="#">Feedback</a></li>
            <li><a href="#">Calendar</a></li>
            <li><a href="#">Study Material</a></li>
            <li><a href="#">Complaints</a></li>
            <li><a href="#">Attendance</a></li>
            <li><a href="#">Plagiarism</a></li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <h1>Faculty Dashboard</h1>

        <div class="buttons">
            <button>My Courses</button>
            <button>Assignments</button>
            <button>Upload Material</button>
            <button>Attendance</button>
            <button>Notifications</button>
            <button>Plagiarism Check</button>
            <button>Generate Report</button>
        </div>

        <h2>Manage Faculty (CRUD)</h2>

        <form id="facultyForm">
            <input type="text" id="name" placeholder="Enter Name" required>
            <input type="number" id="facultyId" placeholder="Enter ID" required>
            <input type="text" id="department" placeholder="Enter Department" required>
            <input type="text" id="designation" placeholder="Enter Designation" required>
            <button type="button" id="addBtn" onclick="addFaculty()">Add</button>
            <button type="button" id="updateBtn" onclick="updateFaculty()" style="display:none;">Update</button>
        </form>

        <table id="facultyTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>ID</th>
                    <th>Department</th>
                    <th>Designation</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="faculty-table-body">
                <!-- Dynamic rows -->
            </tbody>
        </table>
    </div>

    <script src="faculty_dashboard.js"></script>
</body>
</html>
