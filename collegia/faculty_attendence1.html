<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Attendance Dashboard</title>
    <link rel="stylesheet" href="faculty_attendence1.css">
</head>
<body>
    <div class="sidebar">
        <h2>Collegia</h2>
        <ul>
            <li><a href="faculty_attendence1.html"><button>Attendance Sheet</button></a></li>
            <li><a href="faculty_dashboard.html"><button>Dashboard</button></a></li>
            <li><a href="report.html"><button>Report</button></a></li>
        </ul>
    </div>

    <div class="main-content">
        <h1>Attendance</h1>

        <form class="filter-section" onsubmit="event.preventDefault(); addAttendance();">
            <label for="codeInput">Code:</label>
            <input type="text" id="codeInput" placeholder="e.g., CSE2709" required>

            <label for="courseInput">Course Name:</label>
            <input type="text" id="courseInput" placeholder="e.g., Machine Learning" required>

            <label for="countInput">Count:</label>
            <input type="text" id="countInput" placeholder="e.g., 8/10" required>

            <button type="submit">Add</button>
        </form>

        <table>
            <thead>
                <tr>
                    <th>Code</th>
                    <th>Course Name</th>
                    <th>Attendance Count</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="attendanceTable">
                <!-- Data will be dynamically inserted -->
            </tbody>
        </table>
    </div>

    <script src="faculty_attendence1.js"></script>
</body>
</html>
