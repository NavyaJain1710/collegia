<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Table</title>
    <link rel="stylesheet" href="courses.css">
</head>
<body>
    <div class="container">
        <header>
            <img src="https://innovation.ox.ac.uk/wp-content/uploads/2020/07/collegia-logo.png" width="60px" alt="Collegia Logo" class="logo">
            <h1>COURSES</h1>
        </header>

        <table id="courseTable">
            <thead>
                <tr>
                    <th>Code</th>
                    <th>Name</th>
                    <th>Sessions</th>
                    <th>Credits</th>
                    <th>Faculty Name</th>
                    <th>Area</th>
                    <th>Next Lecture On</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Dynamic rows will be inserted -->
            </tbody>
        </table>

        <div class="buttons">
            <button onclick="addCourse()">Add Course</button>
            <button onclick="showAlert()">Class Schedule</button>
            <button onclick="highlightToday()">Highlight Today's Lectures</button>
            <button onclick="sortByName()">Sort by Name</button>
            <button onclick="exportToCSV()">Export CSV</button>
            <button onclick="countTotalCredits()">Total Credits</button>
            <button onclick="filterByFaculty()">Filter by Faculty</button>
        </div>
    </div>

    <script src="courses.js"></script>
</body>
</html>
